<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Migration Plex → Jellyfin</title>
<style>
  :root {
    --bg: #0f1115;
    --bg-card: #171a21;
    --accent: #e5a00d;
    --accent-2: #00a4dc;
    --text: #f2f2f2;
    --text-dim: #a0a6b1;
    --error: #ff5c5c;
    --success: #4ade80;
    --border: #2a2e37;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at 50% 0%, #1b1f29 0%, var(--bg) 60%);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding: 24px;
  }

  .card {
    width: 100%;
    max-width: 480px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 40px 36px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
    text-align: center;
  }

  .logos {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 18px;
    margin-bottom: 20px;
  }

  .badge {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 52px;
    height: 52px;
    border-radius: 14px;
    font-weight: 700;
    font-size: 15px;
    letter-spacing: 0.5px;
  }

  .badge.plex { background: var(--accent); color: #17140a; }
  .badge.jellyfin { background: var(--accent-2); color: #062733; }

  .arrow {
    font-size: 22px;
    color: var(--text-dim);
  }

  h1 {
    font-size: 22px;
    margin: 0 0 8px;
  }

  p.subtitle {
    color: var(--text-dim);
    font-size: 14px;
    line-height: 1.6;
    margin: 0 0 28px;
  }

  .field {
    text-align: left;
    margin-bottom: 18px;
  }

  label {
    display: block;
    font-size: 13px;
    color: var(--text-dim);
    margin-bottom: 6px;
  }

  input[type="text"] {
    width: 100%;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: #0f1218;
    color: var(--text);
    font-size: 15px;
    outline: none;
    transition: border-color 0.15s ease;
  }

  input[type="text"]:focus {
    border-color: var(--accent-2);
  }

  button {
    width: 100%;
    padding: 13px 14px;
    border-radius: 10px;
    border: none;
    background: linear-gradient(135deg, var(--accent-2), #0077a3);
    color: #fff;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.1s ease, opacity 0.15s ease;
  }

  button:hover { opacity: 0.92; }
  button:active { transform: scale(0.98); }

  button:disabled {
    opacity: 0.6;
    cursor: not-allowed;
  }

  .loading {
    margin-top: 22px;
    display: none;
    align-items: center;
    justify-content: center;
    gap: 10px;
    color: var(--text-dim);
    font-size: 14px;
  }

  .loading.show { display: flex; }

  .spinner {
    width: 16px;
    height: 16px;
    border-radius: 50%;
    border: 2px solid var(--border);
    border-top-color: var(--accent-2);
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  .result {
    margin-top: 22px;
    padding: 14px 16px;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 600;
    display: none;
  }

  .result.show { display: block; }

  .result.success {
    background: rgba(74, 222, 128, 0.12);
    border: 1px solid rgba(74, 222, 128, 0.35);
    color: var(--success);
  }

  .result.error {
    background: rgba(255, 92, 92, 0.12);
    border: 1px solid rgba(255, 92, 92, 0.35);
    color: var(--error);
  }

  .result .line {
    display: block;
    opacity: 0;
    transform: translateY(4px);
    transition: opacity 0.4s ease, transform 0.4s ease;
    margin-top: 10px;
  }

  .result .line:first-child {
    margin-top: 0;
  }

  .result .line.visible {
    opacity: 1;
    transform: translateY(0);
  }

  .result .line.emoji {
    font-size: 32px;
  }

  .footer-note {
    margin-top: 24px;
    font-size: 12px;
    color: #555b68;
  }
</style>
</head>
<body>

  <div class="card">
    <div class="logos">
      <span class="badge plex">PLEX</span>
      <span class="arrow">→</span>
      <span class="badge jellyfin">JF</span>
    </div>

    <h1>Migration de compte Plex vers Jellyfin</h1>
    <p class="subtitle">
      Pour finaliser le transfert de votre bibliothèque et de vos accès,
      merci de confirmer votre identité en indiquant votre prénom ci-dessous.
    </p>

    <form id="migration-form">
      <div class="field">
        <label for="name">Votre prénom + la première lettre de votre nom</label>
        <input type="text" id="name" name="name" placeholder="Entrez votre prénom" autocomplete="off" required>
      </div>
      <button type="submit">Confirmer le transfert</button>
    </form>

    <div id="loading" class="loading">
      <span class="spinner"></span>
      <span>Transfert des données en cours…</span>
    </div>

    <div id="result" class="result"></div>

    <p class="footer-note">Migration sécurisée · Plex → Jellyfin</p>
  </div>

  <script>
    const form = document.getElementById('migration-form');
    const input = document.getElementById('name');
    const submitButton = form.querySelector('button[type="submit"]');
    const loading = document.getElementById('loading');
    const result = document.getElementById('result');

    const LOADING_DELAY_MS = 3000;
    const LINE_DELAY_MS = 2000;

    function normalize(str) {
      return str
        .trim()
        .toLowerCase()
        .normalize('NFD')
        .replace(/[̀-ͯ]/g, '');
    }

    function wait(ms) {
      return new Promise((resolve) => setTimeout(resolve, ms));
    }

    const people = {
      borisl: { name: 'Boris', emoji: '👶', phrase: 'Tu vas être un super tonton !' },
      raphaell: { name: 'Raphaël', emoji: '👶', phrase: 'Tu vas être un super tonton !' },
      nicolash: { name: 'Nicolas', emoji: '👶', phrase: 'Tu vas être un super tonton !' },
      natachal: { name: 'Natacha', emoji: '👶', phrase: 'Tu vas être une super tata !' },
      pascales: { name: 'Maman', emoji: '👶', phrase: 'Tu vas être une super grand-mère !' },
      patricias: { name: 'Patricia', emoji: '👶', phrase: 'Tu vas être une super grande tante !' },
      christianh: { name: 'Papa', emoji: '👶', phrase: 'Tu vas être un super grand-père !' },
      claudettes: { name: 'Papi et Mamie', emoji: '👶', phrase: 'Vous allez être de super arrière grands-parents !' },
      davids: { name: 'David', emoji: '👶', phrase: 'Tu vas être un super tonton !' },
      idrissi: { name: 'Idriss', emoji: '👶', phrase: 'Tu vas être un super tonton !' },
      ismaelj: { name: 'Ismaël', emoji: '👶', phrase: 'O2 est enceinte !' },
      anthonya: { name: 'Anthony', emoji: '👶', phrase: 'O2 est enceinte !' },
      antoinep: { name: 'Antoine', emoji: '👶', phrase: 'O2 est enceinte !' },
      claudinep: { name: 'Claudine', emoji: '👶', phrase: 'O2 est enceinte !' },
      anissb: { name: 'Aniss', emoji: '👶', phrase: 'O2 est enceinte !' },
      cyrusn: { name: 'Cyrus', emoji: '👶', phrase: 'Je vais être papa !' },
      maximec: { name: 'Maxime', emoji: '👶', phrase: 'Je vais être papa !' },
      adrienf: { name: 'Adrien', emoji: '👶', phrase: 'Tu vas être un super tonton !' },
      christianh: { name: 'Papa', emoji: '👶', phrase: 'Tu vas être un grand-père !' },
    };

    function resetResult() {
      result.classList.remove('show', 'success', 'error');
      result.innerHTML = '';
    }

    async function revealLines(lines) {
      for (const [index, { text, emoji }] of lines.entries()) {
        if (index > 0) {
          await wait(LINE_DELAY_MS);
        }

        const line = document.createElement('span');
        line.className = emoji ? 'line emoji' : 'line';
        line.textContent = text;
        result.appendChild(line);

        // force reflow so the transition triggers
        line.offsetHeight;
        line.classList.add('visible');
      }
    }

    async function revealSuccess(person) {
      result.classList.add('show', 'success');
      await revealLines([
        { text: person.name },
        { text: "Après 6 ans d'attente... ⏰" },
        { text: "Après 13 020 km parcourus en kangoo... 🚐" },
        { text: "Soit 4 tonnes d'équivalent carbone !" },
        { text: "Après 280 piqûres... 💉" },
        { text: 'Comment te dire ça...' },
        { text: person.emoji, emoji: true },
        { text: person.phrase },
      ]);
    }

    function revealError() {
      result.classList.add('show', 'error');
      const line = document.createElement('span');
      line.className = 'line';
      line.textContent = 'Erreur dans le nom';
      result.appendChild(line);
      line.offsetHeight;
      line.classList.add('visible');
    }

    form.addEventListener('submit', async function (e) {
      e.preventDefault();

      const person = people[normalize(input.value)];

      resetResult();

      if (!person) {
        revealError();
        return;
      }

      submitButton.disabled = true;
      loading.classList.add('show');

      await wait(LOADING_DELAY_MS);

      loading.classList.remove('show');
      await revealSuccess(person);

      submitButton.disabled = false;
    });
  </script>

</body>
</html>
